name: Robust Ubuntu Lab - Permission Fix
on:
  workflow_dispatch:

jobs:
  deploy-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 3600

    steps:
      - name: System Preparation & Service Install
        run: |
          sudo apt-get update
          sudo apt-get install -y xfce4 xfce4-goodies xrdp tightvncserver openssh-server net-tools
          
          sudo systemctl enable ssh
          sudo systemctl start ssh
          echo "xfce4-session" > ~/.xsession
          sudo systemctl enable xrdp
          sudo systemctl start xrdp

      - name: Provision Lab User
        run: |
          sudo useradd -m -s /bin/bash RDP
          echo 'RDP:P@ssword123' | sudo chpasswd
          sudo usermod -aG sudo RDP

      - name: Initialize VNC with Correct Permissions
        run: |
          # 1. Use sudo to create the directory first
          sudo mkdir -p /home/RDP/.vnc
          
          # 2. Set the VNC password
          echo "password" | sudo vncpasswd -f | sudo tee /home/RDP/.vnc/passwd > /dev/null
          
          # 3. CRITICAL: Change ownership to the RDP user
          sudo chown -R RDP:RDP /home/RDP/
          sudo chmod 600 /home/RDP/.vnc/passwd
          
          # 4. Start VNC as the RDP user
          sudo -u RDP vncserver :1 -geometry 1280x720 -depth 16

      - name: Network Layer (Tailscale)
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          if [ -z "$TAILSCALE_AUTH_KEY" ]; then
            echo "CRITICAL ERROR: TAILSCALE_AUTH_KEY missing!"
            exit 1
          fi
          sudo tailscale up --authkey=${TAILSCALE_AUTH_KEY} --hostname=ubuntu-robust-${{ github.run_id }}

      - name: Setup Emergency Browser Access (tmate)
        uses: mxschmitt/action-tmate@v3
        with:
          detached: true 

      - name: Final Connectivity Console
        run: |
          TS_IP=$(tailscale ip -4)
          echo "===================================================="
          echo "NETWORK INFRASTRUCTURE LIVE"
          echo "Tailscale IP: $TS_IP"
          echo "----------------------------------------------------"
          echo "1. SSH: ssh RDP@$TS_IP (Pass: P@ssword123)"
          echo "2. VNC: $TS_IP:5901 (Pass: password)"
          echo "3. RDP: $TS_IP (User: RDP | Pass: P@ssword123)"
          echo "===================================================="
          while true; do
            echo "[$(date)] Monitoring services... all systems nominal."
            sleep 300
          done
