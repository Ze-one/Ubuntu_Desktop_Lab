name: Ubuntu Remote Desktop
on:
  workflow_dispatch:

jobs:  # <--- THIS WAS MISSING
  secure-rdp: # This is the name of your job
    runs-on: ubuntu-latest
    steps:
      - name: Install Desktop Environment and XRDP
        run: |
          sudo apt-get update
          sudo apt-get install -y xfce4 xfce4-goodies xrdp
          echo "xfce4-session" > ~/.xsession
          sudo systemctl enable xrdp
          sudo systemctl start xrdp

      - name: Create Remote User
        run: |
          sudo useradd -m RDP
          echo 'RDP:P@ssword123' | sudo chpasswd
          sudo usermod -aG sudo RDP

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Establish Tailscale Connection
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          sudo tailscale up --authkey=${{ env.TAILSCALE_AUTH_KEY }} --hostname=ubuntu-node-${{ github.run_id }}

      - name: Maintain Connection and Display Info
        run: |
          TS_IP=$(tailscale ip -4)
          echo "===================================="
          echo "IP Address: $TS_IP"
          echo "Username: RDP"
          echo "===================================="
          while true; do sleep 300; done
